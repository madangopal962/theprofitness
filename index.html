<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="logo.png" />
    <title>The Pro Fitness</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand-block">
                <div class="brand-mark"><img src="logo.png" alt="Logo" /></div>
                <div>
                    <h1>The Pro Fitness</h1>
                </div>
            </div>

            <div class="header-actions">
                <button class="theme-toggle" type="button" aria-label="Toggle theme">
                    <span class="toggle-thumb"></span>
                </button>
            </div>
        </header>

        <div class="date-panel">
            <strong id="todayDate">--</strong>
        </div>

        <main class="member-panel">
            <section class="profile-card no-box">
                <div class="credit-card">
                    <div class="card-header-row">
                        <div class="card-status">Active</div>
                        <div></div>
                    </div>
                    <div class="card-photo-id-row">
                        <div class="card-info-row">
                            <div class="member-id-stack">
                                <p class="card-label">Member id</p>
                                <h2>PRO10028</h2>
                            </div>
                        </div>
                        <div class="card-photo-box">
                            <img src="member.jpg" alt="Member photo" />
                        </div>
                    </div>
                    <div class="card-name-block">
                        <h3>Madan Gopal</h3>
                    </div>
                </div>
            </section>

            <aside class="member-summary no-box">
                <div class="summary-box">
                    <p class="label">Date of joining</p>
                    <h4>12 Jan 2024</h4>
                </div>

                <div class="summary-box">
                    <p class="label">Address</p>
                    <h4>CN0096 Jangle Ramgarh Urf Chawri Khorabar, Gorakhpur</h4>
                </div>

                <div class="summary-box">
                    <p class="label">Contact Number</p>
                    <h4>+91 73981 60132</h4>
                </div>

                <div class="summary-box">
                    <p class="label">Last Recharge</p>
                    <div class="recharge-meta">
                        <h4>22 Aug 2026</h4>
                        <span class="recharge-duration">3 Months</span>
                    </div>
                </div>

                <div class="summary-box highlighted">
                    <p class="label">Membership expiry</p>
                    <h4>12 Jan 2026</h4>
                </div>

                <div class="brand-footer" aria-label="The Pro Fitness brand footer">
                    <span>THE PRO</span>
                    <span>FITNESS</span>
                </div>
                <div class="brand-credit">Developed in Gopal's Lab</div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
